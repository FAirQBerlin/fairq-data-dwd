[tool.poetry]
name = "fairq-data-dwd"
version = "2026.02.14"
description = "Code to extract weather data from https://brightsky.dev/ and write it to a Clickhouse database"
authors = ["INWT Statistics GmbH <fairq@inwt-statistics.de>"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
clickhouse-driver = "0.2.10"
numpy = "2.2.6"
pandas = "2.3.3"
python-dateutil = "2.9.0.post0"
python-dotenv = "*"
requests = "2.32.5"
loguru = "^0.7.3"

[tool.poetry.group.dev.dependencies]
ruff = "*"
bumpver = "*"
mypy = "*"
pytest = "*"

[tool.bumpver]
current_version = "2026.02.14"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version to {old_version} -> {new_version}"
tag_message = "v{new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"$',
]
"fairq_data_dwd/__init__.py" = [
    '__version__ = "{version}"$',
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "COM812", "D", "ISC001", "RET504", "S608", "DTZ007"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"fairq_data_dwd/tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison, ...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes,
]